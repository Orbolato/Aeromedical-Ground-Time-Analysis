name: Import MDPI supplementary package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mdpi-supplement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify published package
        shell: bash
        run: |
          set -euo pipefail

          cat .tmp/mdpi_zip_b64_* | tr -d '\r\n' | base64 --decode > /tmp/sci-4311883-supplementary.zip
          echo 'bf5ed650f6560349cf717283c2c927e38c5f8aa5a62c95a573dffb298ad8a969  /tmp/sci-4311883-supplementary.zip' | sha256sum -c -

          rm -rf /tmp/mdpi-supp
          mkdir -p /tmp/mdpi-supp
          unzip -q /tmp/sci-4311883-supplementary.zip -d /tmp/mdpi-supp
          SRC=/tmp/mdpi-supp/sci-4311883-supplementary

          cp "$SRC/toteq_ground_time_analysis.py" ./toteq_ground_time_analysis.py
          rm -rf analysis_outputs
          mkdir -p analysis_outputs
          cp "$SRC"/analysis_outputs/*.csv analysis_outputs/

          rm -rf archive
          mkdir -p archive
          cp /tmp/sci-4311883-supplementary.zip archive/sci-4311883-supplementary.zip

          cat > SHA256SUMS.txt <<'EOF'
          bf5ed650f6560349cf717283c2c927e38c5f8aa5a62c95a573dffb298ad8a969  archive/sci-4311883-supplementary.zip
          42a170d1634ba50e38eacb0aa3ddf6ec99be89f09d77159c310d8ef5ebf0e7e6  toteq_ground_time_analysis.py
          5be52537b545a9422b5da623c2ed93ea674d73a28fa2223e57dc115f8da84b5f  analysis_outputs/audit_counts.csv
          ffe76b76e07365fe90eb13251f8581dfbb4d1a0feb4ed3883314d9186487252d  analysis_outputs/bootstrap_percentile_summary.csv
          82d44c428ab417237e9f86c7f3bbdb72d30856e06a8c52738bb503c1fba6b649  analysis_outputs/chronological_validation_2025.csv
          6aac69d1c820f0607ceca620633c24aa46aa53e478ca6e550e1e1c09109dbdfb  analysis_outputs/mission_descriptive_by_modality.csv
          d9dd5520e08af9837b86300802349778e99a5a768703091a7520eae5fca0d142  analysis_outputs/mission_descriptive_by_organ_profile.csv
          56e3ed739005ba0a555c630270507ce5a95e29a92736d750d1cd240f1363c17e  analysis_outputs/model_comparison_grouped_likelihood.csv
          07f34d42654ae79e0f18f3780018ea8c6022e6d47d42b7ab5c695163c600bb95  analysis_outputs/quarterly_temporal_summary.csv
          2f0a527871051218d98e0393205ef388c343b2ab4c93f29da017d45119be65b0  analysis_outputs/temporal_trend_screen.csv
          1118042d5395338b7b2b48bc664901f4891f12895d4ed1af676ac787b6f64d40  analysis_outputs/threshold_sensitivity.csv
          EOF
          sed -i 's/^          //' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python -m py_compile toteq_ground_time_analysis.py

          rm -rf .tmp results

          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'This repository is intended to host the **published analysis script and aggregate supplementary output tables** associated with the article.',
              'This repository contains the **published analysis script and aggregate supplementary output tables** associated with the article.'
          )
          text = text.replace(
              'The aggregate CSV files are kept under `results/` in this repository.',
              'The aggregate CSV files are kept under `analysis_outputs/`, matching the directory used by the published script.'
          )
          marker = 'https://www.mdpi.com/article/10.3390/sci8070169/s1\n'
          addition = (
              '\nAn exact copy of the published MDPI supplementary ZIP is preserved at '
              '`archive/sci-4311883-supplementary.zip`. The root analysis script and the CSV tables '
              'under `analysis_outputs/` are extracted directly from that archive. `SHA256SUMS.txt` '
              'records and verifies the archive and extracted-file hashes.\n'
          )
          if addition.strip() not in text:
              text = text.replace(marker, marker + addition)
          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/import-mdpi-supplement.yml

      - name: Commit verified supplementary package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Import verified MDPI supplementary code and outputs'
          git push
