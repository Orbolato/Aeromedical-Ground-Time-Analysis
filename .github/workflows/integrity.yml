name: Published-artifact integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify published supplementary checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Check published analysis script syntax
        run: python -m py_compile toteq_ground_time_analysis.py
